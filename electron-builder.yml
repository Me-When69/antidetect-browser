appId: dev.facet.browser
productName: Facet
asar: true
afterPack: scripts/apply-fuses.mjs
electronLanguages:
  - en-US
  - vi
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
  - '!**/*.map'
  - '!**/*.d.ts'
  - '!**/README*'
  - '!**/CHANGELOG*'
  - '!**/LICENSE*'
  - '!**/test/**'
  - '!**/tests/**'
  - '!**/docs/**'
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/playwright-core/**
win:
  icon: build/icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  icon: build/icons/512x512.png
  category: public.app-category.developer-tools
  target:
    - dmg
linux:
  icon: build/icons
  target:
    - AppImage
    - deb
