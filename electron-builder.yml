appId: com.antidetect.browser
productName: Antidetect Browser
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/playwright-core/**
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
linux:
  target:
    - AppImage
